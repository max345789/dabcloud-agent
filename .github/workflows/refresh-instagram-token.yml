name: Refresh Instagram Token

on:
  schedule:
    - cron: '0 3 * * */45'   # Every 45 days at 03:00 UTC (08:30 IST)
  workflow_dispatch:          # Allow manual trigger

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - name: Refresh Instagram long-lived token
        env:
          INSTAGRAM_ACCESS_TOKEN: ${{ secrets.INSTAGRAM_ACCESS_TOKEN }}
          INSTAGRAM_APP_ID: ${{ secrets.INSTAGRAM_APP_ID }}
          INSTAGRAM_APP_SECRET: ${{ secrets.INSTAGRAM_APP_SECRET }}
          GH_PAT: ${{ secrets.GH_PAT_SECRETS }}
          GH_REPO: ${{ github.repository }}
        run: |
          echo "Refreshing Instagram long-lived token..."

          RESPONSE=$(curl -s "https://graph.facebook.com/v25.0/oauth/access_token\
          ?grant_type=fb_exchange_token\
          &client_id=${INSTAGRAM_APP_ID}\
          &client_secret=${INSTAGRAM_APP_SECRET}\
          &fb_exchange_token=${INSTAGRAM_ACCESS_TOKEN}")

          echo "Response: $RESPONSE"

          # Extract new token
          NEW_TOKEN=$(echo "$RESPONSE" | python3 -c "import sys,json; d=json.load(sys.stdin); print(d.get('access_token',''))")

          if [ -z "$NEW_TOKEN" ]; then
            echo "ERROR: Failed to refresh token. Response was: $RESPONSE"
            exit 1
          fi

          echo "Token refreshed successfully."

          # Update GitHub secret
          gh secret set INSTAGRAM_ACCESS_TOKEN \
            --body "$NEW_TOKEN" \
            --repo "$GH_REPO" \
            --token "$GH_PAT"

          echo "GitHub secret INSTAGRAM_ACCESS_TOKEN updated."
