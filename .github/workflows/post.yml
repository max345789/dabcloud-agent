name: DabCloud Plan Agent
on:
  schedule:
    - cron: '30 2 * * *'   # 08:00 IST
    - cron: '30 6 * * *'   # 12:00 IST
    - cron: '30 12 * * *'  # 18:00 IST
  workflow_dispatch:
jobs:
  post:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm install
      - name: Test OpenAI connectivity
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
        run: |
          echo "Testing OpenAI API connectivity..."
          STATUS=$(curl -s -o /tmp/oai_resp.txt -w "%{http_code}" \
            -H "Authorization: Bearer $OPENAI_API_KEY" \
            -H "Content-Type: application/json" \
            https://api.openai.com/v1/models)
          echo "HTTP status: $STATUS"
          cat /tmp/oai_resp.txt | head -c 200
      - name: Run plan agent
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          LINKEDIN_ACCESS_TOKEN: ${{ secrets.LINKEDIN_ACCESS_TOKEN }}
          LINKEDIN_PERSON_URN: ${{ secrets.LINKEDIN_PERSON_URN }}
          INSTAGRAM_ACCESS_TOKEN: ${{ secrets.INSTAGRAM_ACCESS_TOKEN }}
          INSTAGRAM_USER_ID: ${{ secrets.INSTAGRAM_USER_ID }}
          PLAN_START_DATE: ${{ secrets.PLAN_START_DATE }}
        run: node plan-agent.js --force
