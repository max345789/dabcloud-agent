name: DabCloud Plan Agent
on:
  schedule:
    - cron: '30 2 * * *'   # 08:00 IST
    - cron: '30 6 * * *'   # 12:00 IST
    - cron: '30 12 * * *'  # 18:00 IST
  workflow_dispatch:
    inputs:
      day:
        description: 'Override plan day (e.g. 2 for LinkedIn, 7 for Instagram)'
        required: false
        default: ''
jobs:
  post:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm install
      - name: Run plan agent
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          LINKEDIN_ACCESS_TOKEN: ${{ secrets.LINKEDIN_ACCESS_TOKEN }}
          LINKEDIN_PERSON_URN: ${{ secrets.LINKEDIN_PERSON_URN }}
          INSTAGRAM_ACCESS_TOKEN: ${{ secrets.INSTAGRAM_ACCESS_TOKEN }}
          INSTAGRAM_USER_ID: ${{ secrets.INSTAGRAM_USER_ID }}
          PLAN_START_DATE: ${{ secrets.PLAN_START_DATE }}
        run: |
          DAY_ARG=""
          if [ -n "${{ github.event.inputs.day }}" ]; then
            DAY_ARG="--day=${{ github.event.inputs.day }}"
          fi
          node plan-agent.js --force $DAY_ARG
