name: Exchange Token (temp)
on:
  workflow_dispatch:
    inputs:
      short_token:
        required: true
      app_id:
        required: true
      ig_user_id:
        required: true
jobs:
  exchange:
    runs-on: ubuntu-latest
    steps:
      - name: Exchange for long-lived token and update secrets
        env:
          GH_TOKEN: ${{ secrets.GH_PAT_SECRETS }}
          INSTAGRAM_APP_SECRET: ${{ secrets.INSTAGRAM_APP_SECRET }}
        run: |
          LONG_TOKEN=$(curl -s "https://graph.facebook.com/v25.0/oauth/access_token?grant_type=fb_exchange_token&client_id=${{ github.event.inputs.app_id }}&client_secret=${INSTAGRAM_APP_SECRET}&fb_exchange_token=${{ github.event.inputs.short_token }}" | python3 -c "import sys,json; d=json.load(sys.stdin); print(d.get('access_token','ERROR: '+str(d)))")
          echo "Long-lived token obtained: ${LONG_TOKEN:0:20}..."
          
          # Update secrets
          echo "$LONG_TOKEN" | gh secret set INSTAGRAM_ACCESS_TOKEN --repo max345789/dabcloud-agent
          echo "${{ github.event.inputs.ig_user_id }}" | gh secret set INSTAGRAM_USER_ID --repo max345789/dabcloud-agent
          echo "✅ Both secrets updated!"
          
          # Verify token
          curl -s "https://graph.facebook.com/v25.0/debug_token?input_token=${LONG_TOKEN}&access_token=${LONG_TOKEN}" | python3 -c "import sys,json; d=json.load(sys.stdin)['data']; print('Expires:', d.get('expires_at'), '| Valid:', d.get('is_valid'))"
